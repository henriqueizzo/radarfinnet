# Coletor da vertical Split Payment & Reforma Tributária.
# Roda todo dia às 07:00 (Brasília) e também sob demanda
# (aba Actions → "Coletor Split & Reforma" → Run workflow).
name: Coletor Split & Reforma

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 07:00 em Brasília
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coletar:tributario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_PARA: ${{ secrets.DIGEST_PARA }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

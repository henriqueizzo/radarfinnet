# Coletor do Radar Regulatório (BCB, Coaf, Febraban, Open Finance, DOU).
# Roda a cada 3 horas e também sob demanda
# (aba Actions → "Coletor do Radar" → Run workflow).
name: Coletor do Radar

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coletar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_PARA: ${{ secrets.DIGEST_PARA }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
